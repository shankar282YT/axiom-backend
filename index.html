<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Axiom — Study Smarter</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/chat.css"/>
  <style>
    /* guest notice inline style */
    .guest-notice {
      display: flex; align-items: center; gap: 10px;
      background: var(--orange-dim);
      border: 1px solid rgba(244,109,42,0.25);
      border-radius: 10px; padding: 10px 14px;
      font-size: 13px; color: var(--muted);
      max-width: 500px; width: 100%;
      line-height: 1.5;
    }
    .guest-notice span { font-size: 16px; flex-shrink: 0; }
    .guest-notice strong { color: var(--text); }
    .guest-notice a { color: var(--orange); text-decoration: none; font-weight: 600; }
    .guest-notice a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<!-- SIDEBAR OVERLAY (mobile) -->
<div id="sidebarOverlay" class="sidebar-overlay"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="logo-wrap">
    <a href="index.html" class="axiom-logo">
      <svg viewBox="0 0 34 34" fill="none">
        <rect width="34" height="34" rx="9" fill="#1e1a14"/>
        <path d="M17 5L29 27H5L17 5Z" stroke="#f46d2a" stroke-width="1.8" stroke-linejoin="round" fill="none"/>
        <path d="M17 11L24 24H10L17 11Z" fill="#f46d2a" opacity="0.25"/>
        <path d="M10.5 22h13" stroke="#f46d2a" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="17" cy="5" r="1.8" fill="#f46d2a"/>
      </svg>
      <span class="axiom-logo-text">Axi<em>om</em></span>
    </a>
  </div>

  <button class="new-btn" id="newChatBtn">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
      <path d="M6.5 1v11M1 6.5h11" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
    New Chat
  </button>

  <div class="sec-label">Recents</div>
  <div id="historyList"></div>

  <div class="sidebar-spacer"></div>

  <div class="sidebar-footer">
    <div class="footer-item" id="btnProfile">
      <!-- filled by app.js -->
    </div>
    <div class="footer-item" id="btnHistory">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
        <circle cx="7.5" cy="7.5" r="5.5" stroke="currentColor" stroke-width="1.3"/>
        <path d="M7.5 5v3l2 1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      History
    </div>
    <div class="footer-item" id="btnSettings">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
        <circle cx="7.5" cy="7.5" r="2.5" stroke="currentColor" stroke-width="1.3"/>
        <path d="M7.5 1v1.5M7.5 12.5V14M1 7.5h1.5M12.5 7.5H14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M3.1 3.1l1 1M10.9 10.9l1 1M10.9 3.1l-1 1M3.1 10.9l1-1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      Settings
    </div>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <span class="topbar-title" id="topbarTitle">New Chat</span>
    </div>
    <div class="pills">
      <button class="pill active" data-subject="General">General</button>
      <button class="pill" data-subject="Math">Math</button>
      <button class="pill" data-subject="Science">Science</button>
      <button class="pill" data-subject="History">History</button>
      <button class="pill" data-subject="Code">Code</button>
    </div>
  </header>

  <div class="messages" id="messages"></div>

  <div class="input-wrap">
    <div class="input-box">
      <textarea id="inputArea" placeholder="Ask anything..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 13V3M3 8l5-5 5 5" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="input-hint">Axiom Aurora v1 — always double-check important info.</div>
  </div>
</main>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle"></span>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- TEACH AXIOM TOAST -->
<div class="teach-toast" id="teachToast">
  <div class="teach-toast-inner">
    <div class="teach-icon">🤔</div>
    <div class="teach-text">
      <strong>Axiom doesn't know this yet!</strong>
      <p>Help us improve — type the correct answer and we'll add it in a future update.</p>
    </div>
    <button class="teach-close" id="teachClose">✕</button>
  </div>
  <div class="teach-input-row">
    <input type="text" id="teachInput" placeholder="Type the correct answer..."/>
    <button id="teachSubmit">Submit</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
</body>
</html>
